name: Bug report
description: Report a reproducible problem in CredX.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please use synthetic or properly authorized data only. Never include customer records, credentials, tokens, or other personal/financial information.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly.
      placeholder: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest reproducible sequence.
      placeholder: |
        1. Start the backend...
        2. Open...
        3. Submit...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or version
      description: Include the commit SHA or branch, if known.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Node version, and deployment target (if relevant).
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove secrets, tokens, personal information, and customer data before sharing.
